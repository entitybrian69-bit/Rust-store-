# Volt Lapse: replay recording, playback, a cinematic camera and offline
# rendering for Horizon, on PC and Android.
#
# The durable logic lives in the `engine` crate. `runtime.rs` is the support
# module the stage copies into `crates/horizon-client/src/game.rs`, and every
# helper here is a two-line adapter that calls into it. The engine crate is
# staged as a workspace member and horizon-client depends on it, so the helpers
# can name `voltlapse_engine` directly.

[mod]
id = "voltlapse"
version = "1.0.0"
priority = 100

# The horizon revision the bundle was tested against; it uses only the native
# hook points, so the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "41f822b659789780f58d32c63ddfb6887ea1b8bf"

[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "voltlapse"
source = "runtime.rs"

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "hook_tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "hook_frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hook_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "gui"
hook = "gui_render_post"
hook_version = 1
kind = "HEAD"
helper = "hook_gui.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "gui_hidden", ty = "bool", value = "gui_hidden" },
  { name = "focused", ty = "bool", value = "focused" },
]

[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "hook_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
