name: Validate & Publish Horizon .hmod Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-hmods:
    name: Validate .hmod Packages (Horizon API 0.2 Spec)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all releases/*.hmod packages and catalog index
        run: python3 scripts/build_hmods.py --check-only

      - name: Upload .hmod packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-hmod-packages
          path: |
            releases/*.hmod
            catalog/mods-index.json

      - name: Publish .hmod assets to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "Horizon .hmod Store Release ${GITHUB_REF_NAME}" \
              --generate-notes
          gh release upload "${GITHUB_REF_NAME}" releases/*.hmod catalog/mods-index.json --clobber
