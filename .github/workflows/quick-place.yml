name: Quick Place .hmod (pinned legacy WASM toolchain)

# Builds quick-place/ with the real, pinned Horizon toolchain on a GitHub runner,
# runs the host unit tests, the sandbox scripts in quick-place/tests/, the registry
# check, then publishes and commits the resulting .hmod back to this branch.
on:
  push:
    branches: ["arena/5f02db8a-rust-store"]
    paths:
      - "quick-place/**"
      - ".github/workflows/quick-place.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "0.2.0"

jobs:
  build-and-publish:
    name: build, test, check, publish
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the toolchain the runner starts with
        run: |
          rustup --version || true
          rustc --version || true
          cargo --version || true

      - name: Cache the registry, the pinned tool and the toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            ${{ runner.temp }}/qp-tool
          key: qp-${{ runner.os }}-62a01db8-${{ hashFiles('quick-place/Cargo.toml', 'quick-place/rust-toolchain.toml') }}

      - name: Build, test and check with the pinned legacy toolchain
        working-directory: quick-place
        env:
          TOOL_DIR: ${{ runner.temp }}/qp-tool
        run: bash ./build.sh

      - name: Keep the build log on the branch (even when the build fails)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f quick-place/build.log ]; then cp quick-place/build.log dist/build.log; else echo "build.log missing" > dist/build.log; fi
          echo "---- tail of build log ----"
          tail -n 120 dist/build.log || true
          git config user.name "quick-place-ci"
          git config user.email "quick-place-ci@users.noreply.github.com"
          git add -f dist/build.log
          if git diff --cached --quiet; then echo "log unchanged"; else
            git commit -m "ci: quick place build log [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Collect the artifact, its base64 and its SHA-256
        working-directory: quick-place
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp target/horizon-mod/quick_place.hmod ../dist/quick_place.hmod
          cd ../dist
          base64 -w 0 quick_place.hmod > quick_place.hmod.b64
          sha256sum quick_place.hmod | cut -d' ' -f1 > quick_place.hmod.sha256
          cat > RELEASE_NOTES.md <<EOF
          # Quick Place ${VERSION} — legacy WebAssembly server mod

          Built by \`.github/workflows/quick-place.yml\` run \`${GITHUB_RUN_ID}\` on commit
          \`${GITHUB_SHA}\`, with the pinned Horizon toolchain at
          \`62a01db8f006b422e6db24e34dcee05ad41760ba\` (the last main commit with the
          WebAssembly server runtime) and Rust 1.99.1 / wasm32-unknown-unknown.

          - \`quick_place.hmod\` — the mod (manifest + componentized \`mod.wasm\`)
          - \`quick_place.hmod.b64\` — the same bytes, base64, for phones:
            \`base64 -d quick_place.hmod.b64 > quick_place.hmod\`
          - SHA-256: \`$(cat quick_place.hmod.sha256)\`

          Prototype. Not compatible with current PC Horizon (its WebAssembly runtime was
          removed); no registry publication; not tested in a game on PC or Android.
          EOF
          ls -l
          echo "sha256: $(cat quick_place.hmod.sha256)"

      - name: Upload as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: quick-place-hmod-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/quick_place.hmod
            dist/quick_place.hmod.b64
            dist/quick_place.hmod.sha256

      - name: Commit the built .hmod and its base64 back to this branch
        run: |
          set -euo pipefail
          git config user.name "quick-place-ci"
          git config user.email "quick-place-ci@users.noreply.github.com"
          git add -f dist/quick_place.hmod dist/quick_place.hmod.b64 dist/quick_place.hmod.sha256
          if git diff --cached --quiet; then
            echo "already committed"
          else
            git commit -m "ci: quick_place.hmod ${VERSION} built by the pinned toolchain [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="quick-place-v${VERSION}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "Quick Place ${VERSION} (.hmod)" \
              --notes-file dist/RELEASE_NOTES.md
          gh release upload "$tag" \
            dist/quick_place.hmod \
            dist/quick_place.hmod.b64 \
            dist/quick_place.hmod.sha256 \
            --clobber
          echo "asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/quick_place.hmod"
